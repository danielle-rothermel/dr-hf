[project]
name = "dr-hf"
version = "0.1.2"
description = "Hugging Face Hub identity layer: dataset and model pins, named subsets, checkpoint revisions, and publishing"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["huggingface", "datasets", "reproducibility", "checkpoints", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "datasets>=5.1.0,<6",
    "dr-serialize>=0.1.2,<0.2",
    "huggingface_hub>=1.31.0,<3",
    "pydantic>=2.14.0,<3",
]

[project.urls]
Repository = "https://github.com/danielle-rothermel/dr-hf"
Issues = "https://github.com/danielle-rothermel/dr-hf/issues"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
only-include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/dr_hf"]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.uv]
required-version = ">=0.12.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hub'"
markers = [
    "hub: network-backed conformance tests against the Hugging Face Hub (opt-in: pytest -m hub)",
]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
line-length = 79
cache-dir = ".ruff_cache"
exclude = ["outputs/*", "notebooks/*", "data/*"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "PLC0415", "S106", "ARG001"]
"src/dr_hf/io.py" = ["PLC2701"]
"src/dr_hf/location.py" = ["FBT001", "FBT002"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = ["dataclasses.dataclass"]

[tool.ty.src]
include = ["src", "tests"]
