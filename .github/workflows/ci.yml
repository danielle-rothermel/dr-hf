name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - run: uv sync --locked
      - run: uvx tombi@1.2.5 lint .defs/terms.toml .defs/contracts.toml
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest

  minimum-deps:
    name: Minimum dependency floor (Python 3.12)
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.12"
          enable-cache: false
      # Floors must match pyproject.toml minimums and provide cp312 wheels.
      # pandas 2.1.x wheels require numpy 1.x; pin it so uv does not pull numpy 2.
      - name: Smoke-test import against declared dependency floors
        run: |
          uv venv .min-venv --python 3.12
          uv pip install --python .min-venv/bin/python \
            "huggingface-hub==0.20.0" \
            "datasets==2.0.0" \
            "numpy==1.26.4" \
            "pandas==2.1.1" \
            "pydantic==2.0.0" \
            "python-dotenv==1.0.0"
          uv pip install --python .min-venv/bin/python -e . --no-deps
          .min-venv/bin/python -c "import dr_hf; assert dr_hf.__version__"
