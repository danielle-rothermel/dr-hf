#:schema ./contracts.schema.json

[[contracts]]
title = "Dataset publication is one atomic Hub commit"
statement = """
commit_dataset_files_to_hf publishes every dataset file commit entry in one \
HfApi.create_commit call with one CommitOperationAdd per entry. Partial \
remote publication of a multi-file request is not supported."""
rationale = """
A single commit keeps published artifacts consistent at one revision and \
matches Hugging Face's atomic commit model for multi-file updates."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py::test_commit_calls_create_commit_with_expected_args"
terms = ["hub commit", "dataset file commit entry"]

[[contracts]]
title = "Local validation completes before remote mutation"
statement = """
commit_dataset_files_to_hf validates every dataset file commit entry, \
repository path, revision, expected parent commit OID format, and commit \
message locally. Invalid inputs raise before any HfApi network call is \
invoked."""
rationale = """
Rejecting bad inputs before any Hub call prevents partial remote state and \
keeps network failures separate from caller mistakes."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py -k reject"
terms = [
  "dataset artifact",
  "repository path",
  "dataset file commit entry",
]

[[contracts]]
title = "Direct hub commits require optimistic concurrency"
statement = """
When create_pr is false, expected_parent is required and non-empty and is \
forwarded as parent_commit. The Hub rejects direct commits whose parent is \
stale. When create_pr is true, expected_parent names the PR base only and \
does not assert that the target branch is unchanged."""
rationale = """
Direct publication must fail rather than overwrite concurrent branch \
updates. PR publication is non-destructive to the target branch, so the \
parent names the observed base rather than enforcing branch-head equality."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py::test_commit_rejects_empty_expected_parent tests/test_io.py::test_commit_rejects_invalid_expected_parent_oid tests/test_io.py::test_commit_rejects_four_char_expected_parent_oid tests/test_io.py::test_commit_calls_create_commit_with_expected_args tests/test_io.py::test_commit_rejects_stale_parent_noop"
terms = ["expected parent commit", "revision", "hub commit"]

[[contracts]]
title = "Unchanged uploads report no-op status explicitly"
statement = """
When create_pr is false and the Hub performs no commit because every file \
is unchanged, commit_dataset_files_to_hf returns created=false when the \
returned OID matches expected_parent (including abbreviated OIDs). If the \
Hub returns the current revision head without creating a commit, the \
revision head is unchanged since the preflight read, and that OID differs \
from expected_parent, commit_dataset_files_to_hf raises rather than \
reporting success. If the revision head advanced externally between the \
preflight read and the unchanged upload, commit_dataset_files_to_hf \
returns created=false without raising. When create_pr is true, \
created=false when the Hub returns no pull-request metadata; an older \
expected_parent does not trigger a stale-parent error."""
rationale = """
A stale expected_parent on an unchanged upload must not masquerade as a \
successful publication or return an unrelated current OID as if a commit \
were created."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py::test_commit_noop_when_oid_matches_expected_parent tests/test_io.py::test_commit_noop_abbreviated_parent_matches_full_oid tests/test_io.py::test_commit_rejects_stale_parent_noop tests/test_io.py::test_commit_race_noop_after_external_advance tests/test_io.py::test_commit_pr_noop_when_parent_older_than_head tests/test_io_sdk_commit.py"
terms = ["hub commit", "expected parent commit", "dataset commit result"]

[[contracts]]
title = "Callers own dataset layout and publishing policy"
statement = """
dr-hf validates the shape and safety of repository paths and commit \
metadata but does not choose which artifacts to publish, their repository \
layout, the target revision, commit message, or whether the commit opens a \
Hub pull request instead of committing directly."""
rationale = """
Publication policy belongs to the owning pipeline; dr-hf supplies a bounded \
commit primitive with path safety and concurrency checks, not dataset \
organization decisions."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py"
terms = [
  "dataset artifact",
  "repository path",
  "revision",
  "HF location",
]

[[contracts]]
title = "Pins record full commit SHAs"
statement = """
DatasetPin, ModelPin, and ModelProvenance accept only full 40-character \
lowercase hexadecimal commit SHAs. resolve_dataset_pin and \
resolve_model_pin resolve a branch, tag, or SHA through the Hub info \
endpoint and raise when the Hub returns no SHA."""
rationale = """
Branches and tags move. Downstream identities, subset versions, and \
published provenance are only reproducible if they name immutable commits."""
date = "2026-10-08"
check = "uv run pytest -q tests/test_pins.py tests/test_publishing.py::test_provenance_requires_source_sha"
terms = ["commit SHA", "dataset pin", "model pin", "model provenance"]

[[contracts]]
title = "Native ids are validated before rows are yielded"
statement = """
read_rows loads every requested split at the pinned commit and checks, \
before yielding any row, that the native id field exists, that no value is \
null, and that str forms are unique within each split. Violations raise \
NativeIdError."""
rationale = """
Named subsets and downstream items are keyed by native id; a missing or \
repeated id would silently merge or drop rows."""
date = "2026-10-08"
check = "uv run pytest -q tests/test_datasets.py"
terms = ["native id", "source row", "origin split", "dataset pin"]

[[contracts]]
title = "Seeded derivations are reproducible from the derivation"
statement = """
Seeded samples and partitions use the documented rule in dr_hf.subsets: a \
Fisher-Yates order driven only by random.Random(seed).random(), samples \
taking its first size ids, partitions cutting it at floor(n * cumulative \
exact-decimal fraction). Members are listed in parent order. Partitions \
record every share so any part can be recomputed from its own derivation \
and parent."""
rationale = """
Membership must be recomputable from recorded data alone and must not \
depend on Python's unguaranteed shuffle or sample algorithms."""
date = "2026-10-08"
check = "uv run pytest -q tests/test_subsets.py -k 'pinned or disjoint'"
terms = ["derivation", "named subset", "split key"]

[[contracts]]
title = "One registry key maps to one content hash"
statement = """
SubsetRegistry.register is a no-op when the (pin hash, split key) is \
already stored with the same content hash and raises SubsetConflictError, \
leaving the stored subset unchanged, when the content hash differs. \
Concurrent writers to one pin hash are not coordinated."""
rationale = """
A split key is a durable name for a selection. Redefining it in place \
would silently change every result computed against it."""
date = "2026-10-08"
check = "uv run pytest -q tests/test_subsets.py -k registry"
terms = ["subset registry", "named subset", "split key", "content hash"]

[[contracts]]
title = "Model publication is one commit and tags never move"
statement = """
publish_model validates the local directory, card, and provenance before \
any Hub call, then uploads every file, README.md, and provenance.json in \
one create_commit on the target branch and returns the pin of that commit. \
A tag already at that commit is accepted; a tag at another commit raises \
TagConflictError instead of being moved."""
rationale = """
Weights, card, and provenance must describe the same revision, and tags \
such as final-seed0 are consumed as stable names."""
date = "2026-10-08"
check = "uv run pytest -q tests/test_publishing.py"
terms = ["model publication", "model provenance", "model pin"]

[[contracts]]
title = "Content hash is the single hashing seam"
statement = """
Pin hashes and named subset content hashes are computed only by \
content_hash: sha256 over JSON with sorted keys, compact separators, \
ensure_ascii false, and NaN rejected. Swapping in dr-serialize changes all \
hashes; values computed before that swap are not durable identities."""
rationale = """
One seam keeps the later move to canonical hashing a single, deliberate \
change rather than a hunt for ad hoc digests."""
date = "2026-10-08"
check = "uv run pytest -q tests/test_subsets.py -k 'content_hash or hashes_are_pinned'"
terms = ["content hash", "dataset pin", "named subset"]
