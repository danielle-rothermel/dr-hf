#:schema ./contracts.schema.json

[[contracts]]
title = "Dataset publication is one atomic Hub commit"
statement = """
commit_dataset_files_to_hf publishes every dataset file commit entry in one \
HfApi.create_commit call with one CommitOperationAdd per entry. Partial \
remote publication of a multi-file request is not supported."""
rationale = """
A single commit keeps published artifacts consistent at one revision and \
matches Hugging Face's atomic commit model for multi-file updates."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py::test_commit_calls_create_commit_with_expected_args"
terms = ["hub commit", "dataset file commit entry"]

[[contracts]]
title = "Local validation completes before remote mutation"
statement = """
commit_dataset_files_to_hf validates every dataset file commit entry, \
repository path, revision, expected parent commit, and commit message \
locally. Invalid inputs raise before HfApi.create_commit is invoked."""
rationale = """
Rejecting bad inputs before any Hub call prevents partial remote state and \
keeps network failures separate from caller mistakes."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py -k reject"
terms = [
  "dataset artifact",
  "repository path",
  "dataset file commit entry",
]

[[contracts]]
title = "Hub commits require optimistic concurrency"
statement = """
expected_parent is required and non-empty on every hub commit. dr-hf \
forwards it as parent_commit to HfApi.create_commit on every call."""
rationale = """
Requiring the caller to supply the revision head they observed lets the Hub \
reject commits based on stale parent OIDs instead of silently overwriting \
concurrent updates."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py::test_commit_rejects_empty_expected_parent tests/test_io.py::test_commit_calls_create_commit_with_expected_args"
terms = ["expected parent commit", "revision", "hub commit"]

[[contracts]]
title = "Callers own dataset layout and publishing policy"
statement = """
dr-hf validates the shape and safety of repository paths and commit \
metadata but does not choose which artifacts to publish, their repository \
layout, the target revision, commit message, or whether the commit opens a \
Hub pull request instead of committing directly."""
rationale = """
Publication policy belongs to the owning pipeline; dr-hf supplies a bounded \
commit primitive with path safety and concurrency checks, not dataset \
organization decisions."""
date = "2026-08-19"
check = "uv run pytest -q tests/test_io.py"
terms = [
  "dataset artifact",
  "repository path",
  "revision",
  "HF location",
]
